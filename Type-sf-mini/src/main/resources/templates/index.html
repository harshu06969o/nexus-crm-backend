<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini-CRM Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Mini-CRM Dashboard</h1>
          <p class="text-secondary mb-0">Customers overview</p>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Add New Customer</h2>
          </div>

          <form action="/ui/customers/add" method="post" th:object="${customer}">
            <div class="row g-3">
              <div class="col-12 col-md-3">
                <label for="name" class="form-label">Name</label>
                <input
                  id="name"
                  type="text"
                  class="form-control"
                  placeholder="Full name"
                  th:field="*{name}"
                  required
                />
              </div>
              <div class="col-12 col-md-3">
                <label for="email" class="form-label">Email</label>
                <input
                  id="email"
                  type="email"
                  class="form-control"
                  placeholder="name@example.com"
                  th:field="*{email}"
                  required
                />
              </div>
              <div class="col-12 col-md-3">
                <label for="phone" class="form-label">Phone</label>
                <input
                  id="phone"
                  type="text"
                  class="form-control"
                  placeholder="+1 555 1234"
                  th:field="*{phone}"
                />
              </div>
              <div class="col-12 col-md-3">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select" th:field="*{status}" required>
                  <option value="LEAD">LEAD</option>
                  <option value="ACTIVE">ACTIVE</option>
                  <option value="CHURNED">CHURNED</option>
                </select>
              </div>

              <div class="col-12 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">Add Customer</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Phone</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="customer : ${customers}">
                  <td th:text="${customer.id}">1</td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <span class="fw-medium" th:text="${customer.name}">Jane Doe</span>
                      <span class="badge text-bg-light border" title="Support tickets"
                        ><span th:text="${customer.supportTickets.size()}">0</span> tickets</span
                      >
                    </div>
                  </td>
                  <td th:text="${customer.email}">jane@example.com</td>
                  <td th:text="${customer.phone}">+1 555-1234</td>
                  <td>
                    <span
                      class="badge rounded-pill text-bg-secondary"
                      th:text="${customer.status}"
                      >LEAD</span
                    >
                  </td>
                  <td>
                    <a
                      class="btn btn-sm btn-danger"
                      th:href="@{/ui/customers/delete/{id}(id=${customer.id})}"
                      >Delete</a
                    >
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                  <td colspan="6" class="text-center text-secondary py-4">
                    No customers yet.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
